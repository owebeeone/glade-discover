[workspace]
members = [
    "crates/glade-discover-core",
    "crates/glade-discover-node-adapter",
    "crates/glade-discover-protocol",
    "crates/glade-discover-sim",
    "crates/glade-discover-transport-api",
    "crates/glade-discover-signature-api",
    "crates/glade-discover-operation-store-api",
    "crates/glade-discover-acceptance-api",
    "crates/glade-discover-registry-api",
    "crates/glade-discover-trust-api",
    "crates/glade-discover-placement-api",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
