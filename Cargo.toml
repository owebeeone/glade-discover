[workspace]
members = [
    "crates/glade-discover-core",
    "crates/glade-discover-node-adapter",
    "crates/glade-discover-protocol",
    "crates/glade-discover-sim",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

