[package]
name = "glade-architecture-check"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

# Deliberately separate: application/package tests do not compile this tool.
[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full"] }

[lints.rust]
unsafe_code = "forbid"
