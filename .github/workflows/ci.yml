name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  architecture:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: clippy, rustfmt
      - name: Check architecture tool formatting
        run: cargo fmt --manifest-path tools/architecture-check/Cargo.toml -- --check
      - name: Lint architecture tool
        run: cargo clippy --locked --manifest-path tools/architecture-check/Cargo.toml --all-targets -- -D warnings
      - name: Test architecture guard, including rejection cases
        run: cargo test --locked --manifest-path tools/architecture-check/Cargo.toml
      - name: Enforce package boundaries
        run: ./scripts/check-architecture.sh

  contract-interfaces:
    name: Draft interfaces and canonical tests
    needs: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: clippy
      - name: Run opt-in conformance suites (default workspace tests do not enable them)
        run: sh scripts/check-contracts.sh
      - name: Lint opt-in conformance code
        run: cargo clippy --locked -p glade-discover-transport-api -p glade-discover-signature-api -p glade-discover-operation-store-api -p glade-discover-acceptance-api -p glade-discover-registry-api -p glade-discover-trust-api -p glade-discover-placement-api --all-targets --all-features -- -D warnings

  verify:
    needs: [architecture, contract-interfaces]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: clippy, rustfmt
      - name: Verify pinned design and trace
        run: |
          ./scripts/check-design-snapshot.sh
          ./scripts/check-requirement-trace.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --locked --workspace
      - name: Test stable targets
        run: |
          cargo test --locked -p glade-discover-protocol --test corpus
          cargo test --locked -p glade-discover-sim --test all_scenarios
          cargo test --locked -p glade-discover-sim --test deterministic_replay
      - name: Install nightly for fuzz target compilation
        uses: dtolnay/rust-toolchain@nightly-2026-02-28
      - name: Compile nested fuzz workspace
        run: cargo +nightly-2026-02-28 check --locked --manifest-path fuzz/Cargo.toml --bins
